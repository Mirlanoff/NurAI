services:
  api:
    build: .
    command: uvicorn nurai.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      NURAI_ENVIRONMENT: ${NURAI_ENVIRONMENT:-production}
      NURAI_CHUNK_SIZE: ${NURAI_CHUNK_SIZE:-700}
      NURAI_CHUNK_OVERLAP: ${NURAI_CHUNK_OVERLAP:-100}
      NURAI_EMBEDDING_BACKEND: ${NURAI_EMBEDDING_BACKEND:-hashing}
      NURAI_EMBEDDING_MODEL_NAME: ${NURAI_EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      NURAI_DEFAULT_TOP_K: ${NURAI_DEFAULT_TOP_K:-5}
      NURAI_RETRIEVAL_BACKEND: ${NURAI_RETRIEVAL_BACKEND:-hybrid}
      NURAI_RETRIEVAL_CANDIDATE_MULTIPLIER: ${NURAI_RETRIEVAL_CANDIDATE_MULTIPLIER:-3}
      NURAI_HYBRID_VECTOR_WEIGHT: ${NURAI_HYBRID_VECTOR_WEIGHT:-0.7}
      NURAI_RERANKER_BACKEND: ${NURAI_RERANKER_BACKEND:-lexical}
      NURAI_VECTOR_STORE_BACKEND: ${NURAI_VECTOR_STORE_BACKEND:-qdrant}
      NURAI_QDRANT_URL: ${NURAI_QDRANT_URL:-http://qdrant:6333}
      NURAI_QDRANT_COLLECTION: ${NURAI_QDRANT_COLLECTION:-nurai_documents}
      NURAI_MAX_UPLOAD_BYTES: ${NURAI_MAX_UPLOAD_BYTES:-2000000}
      NURAI_LOG_LEVEL: ${NURAI_LOG_LEVEL:-INFO}
      NURAI_API_KEY: ${NURAI_API_KEY:-}
      NURAI_RATE_LIMIT_ENABLED: ${NURAI_RATE_LIMIT_ENABLED:-true}
      NURAI_RATE_LIMIT_REQUESTS: ${NURAI_RATE_LIMIT_REQUESTS:-120}
      NURAI_RATE_LIMIT_WINDOW_SECONDS: ${NURAI_RATE_LIMIT_WINDOW_SECONDS:-60}
      NURAI_METRICS_ENABLED: ${NURAI_METRICS_ENABLED:-true}
      NURAI_REQUEST_ID_HEADER: ${NURAI_REQUEST_ID_HEADER:-X-Request-ID}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
