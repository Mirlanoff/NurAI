services:
  api:
    build: .
    command: uvicorn nurai.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      NURAI_ENVIRONMENT: ${NURAI_ENVIRONMENT:-production}
      NURAI_CHUNK_SIZE: ${NURAI_CHUNK_SIZE:-700}
      NURAI_CHUNK_OVERLAP: ${NURAI_CHUNK_OVERLAP:-100}
      NURAI_DEFAULT_TOP_K: ${NURAI_DEFAULT_TOP_K:-5}
      NURAI_VECTOR_STORE_BACKEND: ${NURAI_VECTOR_STORE_BACKEND:-qdrant}
      NURAI_QDRANT_URL: ${NURAI_QDRANT_URL:-http://qdrant:6333}
      NURAI_QDRANT_COLLECTION: ${NURAI_QDRANT_COLLECTION:-nurai_documents}
      NURAI_MAX_UPLOAD_BYTES: ${NURAI_MAX_UPLOAD_BYTES:-2000000}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
